name: Abaya shop CI CD pipeline
on:
  push:
    paths:
      - "backend/**"
      - "abayashop-frontend/**"
      - ".github/workflows/**"
    branches:
      - main
      - develop
  pull_request:
    paths:
      - "backend/**"
      - "abayashop-frontend/**"
    branches:
      - main

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: ${{secrets.DATABASE_URL}}
      SECRET_KEY: ${{secrets.SECRET_KEY}}
      ALLOWED_HOSTS: ${{vars.ALLOWED_HOSTS}}
      SUPABASE_URL: ${{vars.SUPABASE_URL}}
      SUPABASE_SERVICE_KEY: ${{secrets.SUPABASE_SERVICE_KEY}}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Build docker image
        run: docker build -t abayashop .

      # NEW: run the test-suite inside the image we just built. It uses a throw-away
      # SQLite database, so it needs no secrets and never touches your real database.
      - name: Run tests
        run: |
          docker run --rm \
            -e SECRET_KEY=ci-test-key \
            -e DATABASE_URL=sqlite:////tmp/ci.sqlite3 \
            -e DB_SSL_REQUIRE=False \
            -e DEBUG=True \
            abayashop python -m pytest -q -p no:cacheprovider

      - name: run container
        run: |
          docker run -d -p 8000:8000 --name abayashop-container \
            -e DATABASE_URL="$DATABASE_URL" \
            -e SECRET_KEY="$SECRET_KEY" \
            -e ALLOWED_HOSTS="$ALLOWED_HOSTS" \
            -e SUPABASE_URL="$SUPABASE_URL" \
            -e SUPABASE_SERVICE_KEY="$SUPABASE_SERVICE_KEY" \
            abayashop

      - name: Check container
        run: docker ps -a
      - name: wait for app fail if it does not start #Validation step starts here.
        run: |
          for i in {1..15}; do
            # -f makes curl fail on HTTP errors (e.g. 400 DisallowedHost), not just on no-connection
            if curl -sf http://localhost:8000/; then
              echo "app is running"
              exit 0
            fi
            echo "waiting for app to start"
            sleep 2
          done
          echo "app failed to start"
          exit 1
      - name: Show container logs
        if: always()
        run: docker logs abayashop-container
      ##exit 0 stops because of success & exit 1 stops because an error or failure.

      - name: List Files
        run: ls -la
      - name: Run Health Check
        run: curl -f http://localhost:8000/ ##Validation step ends here
      - name: cleanup container
        if: always()
        run: docker stop abayashop-container && docker rm abayashop-container
      - name: Echo Message
        run: echo "Hello, a CI/CD successful  "

  # NEW: make sure the React storefront still builds.
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: abayashop-frontend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: abayashop-frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
        env:
          VITE_API_URL: https://djangonautserver.onrender.com
