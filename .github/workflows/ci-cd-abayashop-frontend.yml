name: Abaya shop frontend CI CD pipeline
on:
  push:
    paths:
      - "abayashop-frontend/**"
      - ".github/workflows/ci-cd-abayashop-frontend.yml"
    branches:
      - main
    
jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: abayashop-frontend

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Run Linting
        run: npm run lint

      - name: Run Tests
        run: npm test

      - name: Build Project
        run: npm run build

  deploy:
    needs: build-test
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to Vercel
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}